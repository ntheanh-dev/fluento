server:
  port: 8080
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.nta: INFO

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://mysql:3306/fluento?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driverClassName: com.mysql.cj.jdbc.Driver
  jackson:
    time-zone: UTC
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:validate}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
      enabled: true
  reactor:
    debug-agent:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          signer-key: ${JWT_SIGNER_KEY:}
          access-token-valid-duration: 15
          refresh-token-valid-duration: 3
    client:
      registration:
        google:
          client-id: ${GOOGLE_CLIENT_ID:}
          client-secret: ${GOOGLE_CLIENT_SECRET:}
          redirect-uri: ${FRONTEND_DOMAIN:http://localhost:1234}/oauth/authenticate
          scope: openid, profile, email
      provider:
        google:
          authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
          api-uri: https://oauth2.googleapis.com
          user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        base-url: https://generativelanguage.googleapis.com
        completions-path: /v1beta/openai/chat/completions
        options:
          model: ${CHAT_MODEL}

app:
  time-zone: Asia/Ho_Chi_Minh
  api-key-encryption-secret: ${API_KEY_ENCRYPTION_SECRET:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:${FRONTEND_DOMAIN:http://localhost:1234}}
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: Authorization,Content-Type
    allow-credentials: true
    max-age: 3600

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
  secure: true
  folder: ${CLOUDINARY_FOLDER:fluento}