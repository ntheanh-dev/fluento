    <title>LuyenViet | Luyen tap tieng Viet hieu qua moi ngay</title>
    <script id="seo-structured-data" type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "LuyenViet",
        "url": "/home",
        "inLanguage": "vi-VN",
        "description": "LuyenViet giup ban luyen tap tieng Viet moi ngay voi bai tap thong minh va lo trinh hoc ca nhan hoa."
      }
    </script>
    <!-- Runtime environment variables (generated at container start) -->
    <script src="/env.js" data-vite-ignore></script>
    <script>
      (function () {
        var runtimeSiteUrl =
          (window.__ENV__ &&
            window.__ENV__.VITE_SITE_URL &&
            String(window.__ENV__.VITE_SITE_URL).trim()) ||
          "";
        var origin = runtimeSiteUrl || window.location.origin || "";
        var normalizedOrigin = origin.replace(/\/+$/, "");
        var homeUrl = normalizedOrigin ? normalizedOrigin + "/home" : "/home";
        var imageUrl = normalizedOrigin
          ? normalizedOrigin + "/src/assets/image/logo2.png"
          : "/src/assets/image/logo2.png";

        var canonicalEl = document.getElementById("seo-canonical");
        var alternateViEl = document.getElementById("seo-alternate-vi");
        var alternateDefaultEl = document.getElementById("seo-alternate-default");
        var ogUrlEl = document.getElementById("seo-og-url");
        var ogImageEl = document.getElementById("seo-og-image");
        var twitterImageEl = document.getElementById("seo-twitter-image");
        var structuredDataEl = document.getElementById("seo-structured-data");

        if (canonicalEl) canonicalEl.setAttribute("href", homeUrl);
        if (alternateViEl) alternateViEl.setAttribute("href", homeUrl);
        if (alternateDefaultEl) alternateDefaultEl.setAttribute("href", homeUrl);
        if (ogUrlEl) ogUrlEl.setAttribute("content", homeUrl);
        if (ogImageEl) ogImageEl.setAttribute("content", imageUrl);
        if (twitterImageEl) twitterImageEl.setAttribute("content", imageUrl);

        if (structuredDataEl) {
          structuredDataEl.textContent = JSON.stringify({
            "@context": "https://schema.org",
            "@type": "WebSite",
            name: "LuyenViet",
            url: homeUrl,
            inLanguage: "vi-VN",
            description:
              "LuyenViet giup ban luyen tap tieng Viet moi ngay voi bai tap thong minh va lo trinh hoc ca nhan hoa.",
          });
        }
      })();
    </script>
    <script>
      (function () {
        try {
          var k = "luyenviet-theme";
          var v = localStorage.getItem(k);
          var dark =
            v === "dark" ||
            (v !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
