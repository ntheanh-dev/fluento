version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: luyenviet-mysql
    restart: unless-stopped
    command: --default-time-zone='+07:00'
    expose:
      - "3306"
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-luyenviet}
      MYSQL_USER: ${MYSQL_USER:-app_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    volumes:
      - ./mysql_data:/var/lib/mysql
      - ./backend/src/main/resources/db:/docker-entrypoint-initdb.d
    networks:
      - luyenviet-network

  # Backend Spring Boot
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: luyenviet-backend
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=hub
      - FRONTEND_DOMAIN=http://localhost:1234
      - LOG_PATH=/var/log/luyenviet
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
      - APP_TIME_ZONE=${APP_TIME_ZONE:-Asia/Ho_Chi_Minh}
      - JAVA_TOOL_OPTIONS=-Duser.timezone=${APP_TIME_ZONE:-Asia/Ho_Chi_Minh}
    volumes:
      - ./logs:/var/log/luyenviet
    depends_on:
      - mysql
    networks:
      - luyenviet-network

  # Frontend React
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
        - VITE_GOOGLE_CLIENT_ID=940316326175-8jma9br9b2j1cjgqu992v3a693euvr6c.apps.googleusercontent.com
        - VITE_GOOGLE_REDIRECT_URI=http://localhost:1234/oauth/authenticate
        - VITE_GOOGLE_AUTH_URI=https://accounts.google.com/o/oauth2/v2/auth
    container_name: luyenviet-frontend
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
    ports:
      - "1234:80"
    depends_on:
      - backend
    networks:
      - luyenviet-network

volumes:
  mysql_data:
    driver: local

networks:
  luyenviet-network:
    driver: bridge