version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: fluento-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: Admin@123
      MYSQL_DATABASE: fluento
      MYSQL_USER: app_user
      MYSQL_PASSWORD: Admin@123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/src/main/resources/db:/docker-entrypoint-initdb.d
    networks:
      - fluento-network

  # Backend Spring Boot
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fluento-backend
    restart: unless-stopped
    ports:
      - "9000:8080"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
    depends_on:
      - mysql
    networks:
      - fluento-network

  # Frontend React
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fluento-frontend
    restart: unless-stopped
    ports:
      - "1234:80"
    depends_on:
      - backend
    networks:
      - fluento-network

volumes:
  mysql_data:
    driver: local

networks:
  fluento-network:
    driver: bridge
