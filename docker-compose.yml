version: '3.8'

services:
  # MySQL Database
  mysql:
    build:
      context: ./mysql
      dockerfile: Dockerfile
    container_name: fluento-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql
      - ./backend/src/main/resources/db:/docker-entrypoint-initdb.d
    networks:
      - fluento-network

  # Backend Spring Boot
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fluento-backend
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=hub
      - FRONTEND_DOMAIN=http://localhost:1234
      - LOG_PATH=/var/log/fluento
    volumes:
      - ./logs:/var/log/fluento
    depends_on:
      - mysql
    networks:
      - fluento-network

  # Frontend React
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
        - VITE_GOOGLE_CLIENT_ID=940316326175-8jma9br9b2j1cjgqu992v3a693euvr6c.apps.googleusercontent.com
        - VITE_GOOGLE_REDIRECT_URI=http://localhost:1234/oauth/authenticate
        - VITE_GOOGLE_AUTH_URI=https://accounts.google.com/o/oauth2/v2/auth
    container_name: fluento-frontend
    restart: unless-stopped
    ports:
      - "1234:80"
    depends_on:
      - backend
    networks:
      - fluento-network

volumes:
  mysql_data:
    driver: local

networks:
  fluento-network:
    driver: bridge