# Docker Compose optimized for VPS (1GB RAM, 1 vCPU)
# Usage: docker-compose -f docker-compose.vps.yml up -d

services:
  # MySQL Database - Optimized for low memory
  mysql:
    image: theanhn28/fluento-mysql:1.1
    container_name: fluento-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --innodb-buffer-pool-size=128M --max-connections=50 --innodb-log-file-size=32M
    deploy:
      resources:
        limits:
          memory: 300M
          cpus: '0.5'
        reservations:
          memory: 200M
          cpus: '0.3'
    networks:
      - fluento-network

  # Backend Spring Boot - Optimized JVM settings
  backend:
    image: theanhn28/fluento-backend:1.1
    container_name: fluento-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT}:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - JAVA_OPTS=-Xmx300m -Xms200m -XX:+UseG1GC -XX:MaxGCPauseMillis=200
      - BACKEND_PORT=${BACKEND_PORT}
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      # CORS Configuration
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - CORS_ALLOWED_METHODS=${CORS_ALLOWED_METHODS}
      - CORS_ALLOWED_HEADERS=${CORS_ALLOWED_HEADERS}
      - CORS_ALLOW_CREDENTIALS=${CORS_ALLOW_CREDENTIALS}
      - CORS_MAX_AGE=${CORS_MAX_AGE}
    depends_on:
      - mysql
    deploy:
      resources:
        limits:
          memory: 400M
          cpus: '0.4'
        reservations:
          memory: 300M
          cpus: '0.2'
    networks:
      - fluento-network

  # Frontend React - Minimal resource usage
  frontend:
    image: theanhn28/fluento-frontend:1.0
    container_name: fluento-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 100M
          cpus: '0.1'
        reservations:
          memory: 50M
          cpus: '0.05'
    networks:
      - fluento-network

volumes:
  mysql_data:
    driver: local

networks:
  fluento-network:
    driver: bridge
