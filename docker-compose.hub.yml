version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: luyenviet-mysql-hub
    restart: unless-stopped
    # VPS ~2GB: giữ MySQL gọn trong cgroup; chỉnh thêm để tránh MySQL tự xin RAM lớn
    mem_limit: 512m
    command: >
      --innodb-buffer-pool-size=256M
      --performance-schema=OFF
      --max_connections=100
      --default-time-zone='+07:00'
    expose:
      - "3306"
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-luyenviet}
      MYSQL_USER: ${MYSQL_USER:-app_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - ./mysql_data_hub:/var/lib/mysql
    networks:
      - luyenviet
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      interval: 30s
      start_period: 30s

  backend:
    image: ${DOCKERHUB_USERNAME:-theanhn28}/luyenviet-backend:${IMAGE_TAG:-latest}
    container_name: luyenviet-backend-hub
    restart: unless-stopped
    # JVM mặc định ~25% cgroup → heap quá nhỏ; 70% của 768m ≈ heap hợp lý cho Spring trên 2GB VPS
    mem_limit: 768m
    ports:
      - "8080:8080"
    environment:
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=70.0 -XX:+ExitOnOutOfMemoryError} -Duser.timezone=${APP_TIME_ZONE:-Asia/Ho_Chi_Minh}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      APP_TIME_ZONE: ${APP_TIME_ZONE:-Asia/Ho_Chi_Minh}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-hub}
      FRONTEND_DOMAIN: ${FRONTEND_DOMAIN:-http://localhost:1234}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:1234}
      LOG_PATH: ${LOG_PATH:-/var/log/luyenviet}

      DB_URL: ${DB_URL:-jdbc:mysql://mysql:3306/luyenviet?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD}

      JWT_SIGNER_KEY: ${JWT_SIGNER_KEY}
      API_KEY_ENCRYPTION_SECRET: ${API_KEY_ENCRYPTION_SECRET}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}

      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-luyenviet}

      # Optional AI envs (default to empty)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CHAT_MODEL: ${CHAT_MODEL:-}

      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}

    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/actuator/health"]
      timeout: 5s
      retries: 12
      interval: 10s
      start_period: 20s
    networks:
      - luyenviet
    volumes:
      - ./logs:/var/log/luyenviet

  frontend:
    image: ${DOCKERHUB_USERNAME:-theanhn28}/luyenviet-frontend:${IMAGE_TAG:-latest}
    container_name: luyenviet-frontend-hub
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-1234}:80"
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      VITE_API_URL: ${VITE_API_URL:-/api}
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
      VITE_GOOGLE_REDIRECT_URI: ${VITE_GOOGLE_REDIRECT_URI:-}
      VITE_GOOGLE_AUTH_URI: ${VITE_GOOGLE_AUTH_URI:-}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - luyenviet
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/"]
      timeout: 5s
      retries: 12
      interval: 10s
      start_period: 10s

networks:
  luyenviet:
    driver: bridge

volumes:
  mysql_data_hub:
    driver: local

