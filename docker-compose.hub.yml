# Variable substitution (${VAR}) uses the shell and a file named `.env` in this directory by default.
# If you keep secrets in `.env.production`, run:
#   docker compose --env-file .env.production -f docker-compose.hub.yml up -d
services:
  mysql:
    image: mysql:8.0
    container_name: luyenviet-mysql-hub
    restart: unless-stopped
    mem_limit: 384m
    command: >
      --innodb-buffer-pool-size=256M
      --performance-schema=OFF
      --max_connections=100
      --default-time-zone='+07:00'
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    expose:
      - "3306"
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-luyenviet}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - ./mysql_data_hub:/var/lib/mysql
    networks:
      - luyenviet
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      interval: 30s
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: ${DOCKERHUB_USERNAME:-theanhn28}/luyenviet-backend:${IMAGE_TAG:-latest}
    container_name: luyenviet-backend-hub
    restart: unless-stopped
    mem_limit: 768m
    expose:
      - "8080"
    environment:
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:InitialRAMPercentage=20.0 -XX:MaxRAMPercentage=60.0 -XX:+ExitOnOutOfMemoryError} -Duser.timezone=${APP_TIME_ZONE:-Asia/Ho_Chi_Minh}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      APP_TIME_ZONE: ${APP_TIME_ZONE:-Asia/Ho_Chi_Minh}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-hub}
      FRONTEND_DOMAIN: ${FRONTEND_DOMAIN:-http://localhost:1234}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:1234}
      LOG_PATH: ${LOG_PATH:-/var/log/luyenviet}

      DB_URL: ${DB_URL:-jdbc:mysql://mysql:3306/luyenviet?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=UTC}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD}

      JWT_SIGNER_KEY: ${JWT_SIGNER_KEY}
      API_KEY_ENCRYPTION_SECRET: ${API_KEY_ENCRYPTION_SECRET}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}

      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-luyenviet}

      # Optional AI envs (default to empty)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CHAT_MODEL: ${CHAT_MODEL:-}

      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}

    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/actuator/health"]
      timeout: 5s
      retries: 12
      interval: 10s
      start_period: 20s
    networks:
      - luyenviet
    volumes:
      - ./logs:/var/log/luyenviet
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  frontend-builder:
    image: ${DOCKERHUB_USERNAME:-theanhn28}/luyenviet-frontend:${IMAGE_TAG:-latest}
    container_name: luyenviet-frontend-builder-hub
    restart: "no"
    mem_limit: 96m
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    command: >
      sh -c "rm -rf /static/* && cp -r /app/dist/. /static && echo 'Static assets copied to /static'"
    volumes:
      - frontend_static:/static
    networks:
      - luyenviet
    healthcheck:
      test: ["CMD", "test", "-f", "/app/dist/index.html"]
      timeout: 5s
      retries: 3
      interval: 10s
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  nginx:
    image: ${DOCKERHUB_USERNAME:-theanhn28}/luyenviet-nginx:${IMAGE_TAG:-latest}
    container_name: luyenviet-nginx-hub
    restart: unless-stopped
    mem_limit: 128m
    expose:
      - "80"
      - "443"
    ports:
      - "80:80"
      - "443:443"
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-luyenviet.online www.luyenviet.online localhost}
    depends_on:
      backend:
        condition: service_healthy
      frontend-builder:
        condition: service_completed_successfully
    volumes:
      - frontend_static:/usr/share/nginx/html:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - luyenviet
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/"]
      timeout: 5s
      retries: 12
      interval: 10s
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  luyenviet:
    driver: bridge

volumes:
  mysql_data_hub:
    driver: local
  frontend_static:
    driver: local

