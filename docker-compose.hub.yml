version: '3.8'

services:
  mysql:
    image: ${DOCKERHUB_USERNAME:-theanhn28}/fluento-mysql:${IMAGE_TAG:-latest}
    container_name: fluento-mysql-hub
    restart: unless-stopped
    expose:
      - "3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fluento}
      MYSQL_USER: ${MYSQL_USER:-app_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - ./mysql_data_hub:/var/lib/mysql
    networks:
      - fluento
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      interval: 30s
      start_period: 30s

  backend:
    image: ${DOCKERHUB_USERNAME:-theanhn28}/fluento-backend:${IMAGE_TAG:-latest}
    container_name: fluento-backend-hub
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-hub}
      FRONTEND_DOMAIN: ${FRONTEND_DOMAIN:-http://localhost:1234}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:1234}
      LOG_PATH: ${LOG_PATH:-/var/log/fluento}

      DB_URL: ${DB_URL:-jdbc:mysql://mysql:3306/fluento?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD}

      JWT_SIGNER_KEY: ${JWT_SIGNER_KEY}
      API_KEY_ENCRYPTION_SECRET: ${API_KEY_ENCRYPTION_SECRET}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}

      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-fluento}

      # Optional AI envs (default to empty)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CHAT_MODEL: ${CHAT_MODEL:-}

    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/actuator/health"]
      timeout: 5s
      retries: 12
      interval: 10s
      start_period: 20s
    networks:
      - fluento
    volumes:
      - ./logs:/var/log/fluento

  # Frontend React from Docker Hub
  frontend:
    image: ${DOCKERHUB_USERNAME:-theanhn28}/fluento-frontend:${IMAGE_TAG:-latest}
    container_name: fluento-frontend-hub
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-1234}:80"
    environment:
      VITE_API_URL: ${VITE_API_URL:-/api}
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
      VITE_GOOGLE_REDIRECT_URI: ${VITE_GOOGLE_REDIRECT_URI:-}
      VITE_GOOGLE_AUTH_URI: ${VITE_GOOGLE_AUTH_URI:-}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - fluento
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/"]
      timeout: 5s
      retries: 12
      interval: 10s
      start_period: 10s

networks:
  fluento:
    driver: bridge

volumes:
  mysql_data_hub:
    driver: local

