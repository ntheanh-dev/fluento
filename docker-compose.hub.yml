# Docker Compose for Docker Hub Images
# Usage: docker-compose -f docker-compose.hub.yml up -d

services:
  # MySQL Database from Docker Hub
  mysql:
    image: theanhn28/fluento-mysql:1.1
    container_name: fluento-mysql-hub
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql_data_hub:/var/lib/mysql
    networks:
      - fluento-network

  # Backend Spring Boot from Docker Hub
  backend:
    image: theanhn28/fluento-backend:1.1
    container_name: fluento-backend-hub
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT}:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - BACKEND_PORT=${BACKEND_PORT}
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      # CORS Configuration
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - CORS_ALLOWED_METHODS=${CORS_ALLOWED_METHODS}
      - CORS_ALLOWED_HEADERS=${CORS_ALLOWED_HEADERS}
      - CORS_ALLOW_CREDENTIALS=${CORS_ALLOW_CREDENTIALS}
      - CORS_MAX_AGE=${CORS_MAX_AGE}
    depends_on:
      - mysql
    networks:
      - fluento-network

  # Frontend React from Docker Hub
  frontend:
    image: theanhn28/fluento-frontend:1.0
    container_name: fluento-frontend-hub
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - backend
    networks:
      - fluento-network

volumes:
  mysql_data_hub:
    driver: local

networks:
  fluento-network:
    driver: bridge
